<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>CloudSentinel AI — Cloud Security Posture Management</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root{
  --bg:#0a0f1d;
  --bg-panel:#111a2c;
  --bg-panel-alt:#0d1526;
  --bg-raised:#182338;
  --border:#1f2c44;
  --border-bright:#2b3b58;
  --blue:#4f7cff;
  --blue-dim:#1c3a7a;
  --blue-glow:rgba(79,124,255,0.14);
  --text:#c3cbe0;
  --text-bright:#f2f5fc;
  --text-dim:#6b7794;
  --red:#f0455c;
  --red-dim:#3a1420;
  --amber:#f5a623;
  --amber-dim:#3a2a10;
  --green:#35c780;
  --green-dim:#0f2e22;
  --purple:#9b6ef3;
  --purple-dim:#2a1f4a;
  --cyan:#38bdf8;
  --sans:'Inter', sans-serif;
  --mono:'JetBrains Mono', monospace;
}
*{box-sizing:border-box; margin:0; padding:0;}
body{
  background:var(--bg);
  color:var(--text);
  font-family:var(--sans);
  font-size:13.5px;
  line-height:1.5;
  min-height:100vh;
}
::selection{background:var(--blue); color:#fff;}
::-webkit-scrollbar{width:8px; height:8px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:var(--border-bright); border-radius:4px;}
svg.icon{width:16px; height:16px; stroke:currentColor; fill:none; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; flex-shrink:0;}

/* ===== SHELL ===== */
.shell{display:flex; min-height:100vh;}

/* ===== SIDEBAR ===== */
.sidebar{
  width:236px; flex-shrink:0; background:var(--bg-panel-alt); border-right:1px solid var(--border);
  display:flex; flex-direction:column; padding:18px 12px; position:sticky; top:0; height:100vh; overflow-y:auto;
}
.brand{display:flex; align-items:center; gap:10px; padding:4px 8px 20px;}
.brand-mark{
  width:36px; height:36px; border-radius:9px; flex-shrink:0;
  background:linear-gradient(135deg, var(--blue), #2a4fd6);
  display:flex; align-items:center; justify-content:center; color:#fff;
}
.brand-text{font-weight:800; font-size:15px; color:var(--text-bright); letter-spacing:-0.2px;}
.brand-sub{font-size:10.5px; color:var(--blue); font-weight:600; letter-spacing:0.4px;}
.nav-item{
  display:flex; align-items:center; gap:11px; padding:9px 12px; border-radius:8px; cursor:pointer;
  color:var(--text-dim); font-size:12.8px; font-weight:500; margin-bottom:2px; position:relative;
}
.nav-item:hover{background:var(--bg-raised); color:var(--text);}
.nav-item.active{background:var(--blue); color:#fff; box-shadow:0 4px 14px rgba(79,124,255,0.35);}
.nav-item.active svg.icon{stroke:#fff;}
.nav-badge{
  margin-left:auto; font-size:9px; font-weight:800; background:linear-gradient(135deg,var(--purple),var(--blue));
  color:#fff; padding:2px 6px; border-radius:5px; letter-spacing:0.4px;
}
.nav-count{margin-left:auto; font-size:10px; background:var(--red-dim); color:var(--red); padding:1px 6px; border-radius:9px; font-weight:700;}
.nav-item.active .nav-count{background:rgba(255,255,255,0.25); color:#fff;}
.env-box{
  margin-top:auto; background:var(--bg-panel); border:1px solid var(--border); border-radius:12px; padding:14px;
}
.env-title{font-size:11px; font-weight:700; color:var(--text-bright); margin-bottom:10px; text-transform:uppercase; letter-spacing:0.5px;}
.env-row{display:flex; align-items:center; justify-content:space-between; padding:5px 0; font-size:11.5px; color:var(--text-dim);}
.env-row b{color:var(--text-bright); font-weight:700;}
.env-scan{display:flex; align-items:center; gap:6px; margin-top:8px; padding-top:8px; border-top:1px solid var(--border); font-size:10.5px; color:var(--text-dim);}

/* ===== TOP BAR ===== */
.content{flex:1; min-width:0; display:flex; flex-direction:column;}
.topbar{
  display:flex; align-items:center; justify-content:space-between; padding:16px 26px;
  border-bottom:1px solid var(--border); background:var(--bg);
  position:sticky; top:0; z-index:5;
}
.topbar-left{display:flex; align-items:center; gap:16px;}
.hamburger{color:var(--text-dim); cursor:pointer;}
.page-title{font-size:19px; font-weight:800; color:var(--text-bright); letter-spacing:-0.3px;}
.page-desc{font-size:11.5px; color:var(--text-dim); margin-top:1px;}
.topbar-right{display:flex; align-items:center; gap:10px;}
.cloud-badge{
  display:flex; align-items:center; gap:6px; padding:6px 12px; border:1px solid var(--border); border-radius:8px;
  font-size:11.5px; font-weight:600; color:var(--text);
}
.icon-btn{
  width:34px; height:34px; border-radius:8px; border:1px solid var(--border); display:flex; align-items:center;
  justify-content:center; color:var(--text-dim); cursor:pointer; position:relative;
}
.icon-btn:hover{border-color:var(--border-bright); color:var(--text);}
.date-select{
  padding:7px 12px; border:1px solid var(--border); border-radius:8px; font-size:11.5px; color:var(--text);
  background:var(--bg-panel); display:flex; align-items:center; gap:6px;
}
.avatar{width:34px; height:34px; border-radius:50%; background:var(--blue-dim); display:flex; align-items:center; justify-content:center; color:var(--blue); border:1px solid var(--border-bright);}

/* ===== MAIN ===== */
.main{flex:1; padding:22px 26px 40px; overflow-x:hidden;}
.view{display:none;}
.view.active{display:block;}

/* ===== DASHBOARD GRID ===== */
.dash-grid{display:grid; grid-template-columns:1fr 336px; gap:16px; align-items:start;}
.dash-left{display:flex; flex-direction:column; gap:16px; min-width:0;}
.dash-right{display:flex; flex-direction:column; gap:16px;}

.metrics-row{display:grid; grid-template-columns:repeat(5,1fr); gap:14px;}
.row3{display:grid; grid-template-columns:1.1fr 1.3fr 1.4fr; gap:14px;}
.row-resources{display:grid; grid-template-columns:1fr 1fr 1.3fr; gap:14px;}

/* ===== CARDS ===== */
.card{background:var(--bg-panel); border:1px solid var(--border); border-radius:14px; padding:16px 18px;}
.card-title{
  font-size:12.5px; font-weight:700; color:var(--text-bright); margin-bottom:12px;
  display:flex; justify-content:space-between; align-items:center;
}
.card-title .link-btn{font-size:11px; font-weight:600;}

.metric-card{display:flex; flex-direction:column; gap:2px;}
.metric-label{font-size:11.5px; color:var(--text-dim); font-weight:600;}
.metric-row{display:flex; align-items:baseline; gap:8px; margin-top:6px;}
.metric-val{font-size:26px; font-weight:800; color:var(--text-bright); letter-spacing:-0.5px;}
.metric-val.red{color:var(--red);} .metric-val.amber{color:var(--amber);} .metric-val.green{color:var(--green);} .metric-val.blue{color:var(--blue);}
.metric-trend{font-size:11px; font-weight:700; display:flex; align-items:center; gap:2px;}
.metric-trend.up{color:var(--red);} .metric-trend.down{color:var(--green);}
.metric-caption{font-size:11px; color:var(--text-dim); margin-top:4px;}
.spark{height:34px; margin-top:8px;}

.legend-list{margin-top:4px;}
.legend-row{display:flex; align-items:center; gap:8px; padding:5px 0; font-size:11.8px;}
.legend-swatch{width:9px; height:9px; border-radius:3px; flex-shrink:0;}
.legend-row .lbl{color:var(--text); flex:1;}
.legend-row .cnt{font-weight:700; color:var(--text-bright);}
.legend-row .pct{color:var(--text-dim); font-size:10.5px; width:38px; text-align:right;}

.misconfig-row{display:flex; align-items:center; gap:10px; padding:8px 0; border-bottom:1px solid var(--border); font-size:12px;}
.misconfig-row:last-child{border-bottom:none;}
.misconfig-icon{
  width:26px; height:26px; border-radius:7px; display:flex; align-items:center; justify-content:center; flex-shrink:0;
}
.misconfig-row .lbl{flex:1; color:var(--text);}
.misconfig-count{font-weight:800; color:var(--text-bright); font-size:12.5px;}

.activity-row{display:flex; align-items:flex-start; gap:10px; padding:8px 0; border-bottom:1px solid var(--border); font-size:12px;}
.activity-row:last-child{border-bottom:none;}
.activity-icon{width:24px; height:24px; border-radius:6px; display:flex; align-items:center; justify-content:center; flex-shrink:0; margin-top:1px;}
.activity-title{color:var(--text-bright); font-weight:600;}
.activity-sub{color:var(--text-dim); font-size:11px; margin-top:1px;}
.activity-time{color:var(--text-dim); font-size:10.5px; white-space:nowrap; margin-left:auto;}

.alert-card{display:flex; gap:10px; padding:10px 0; border-bottom:1px solid var(--border);}
.alert-card:last-child{border-bottom:none;}
.alert-icon{width:30px; height:30px; border-radius:8px; display:flex; align-items:center; justify-content:center; flex-shrink:0;}
.alert-title{font-size:12px; font-weight:700; color:var(--text-bright);}
.alert-sub{font-size:11px; color:var(--text-dim); margin-top:2px;}
.alert-time{font-size:10px; color:var(--text-dim); margin-top:3px;}
.alert-badge{margin-left:auto; align-self:flex-start;}

.ai-insight-card{
  border-radius:14px; padding:18px; color:#fff; position:relative; overflow:hidden;
  background:linear-gradient(150deg, #4634b0 0%, #3555d6 55%, #2447c9 100%);
  border:1px solid rgba(255,255,255,0.08);
}
.ai-insight-card::before{
  content:""; position:absolute; top:-40px; right:-40px; width:140px; height:140px; border-radius:50%;
  background:radial-gradient(circle, rgba(255,255,255,0.14), transparent 70%);
}
.ai-badge{display:flex; align-items:center; gap:6px; font-size:12px; font-weight:700; color:#e6ddff;}
.ai-headline{font-size:14px; font-weight:700; margin-top:10px;}
.ai-body{font-size:11.8px; color:#d7d9f5; margin-top:6px; line-height:1.5;}
.ai-factor{font-size:11px; color:#c9cdf5; margin-top:10px;}
.ai-factor b{color:#fff; display:block; font-size:12.5px; margin-top:2px;}
.ai-btn{
  margin-top:14px; background:#fff; color:#2447c9; border:none; padding:9px 14px; border-radius:8px;
  font-size:12px; font-weight:700; cursor:pointer; width:100%;
}

.compliance-row{padding:9px 0;}
.compliance-head{display:flex; justify-content:space-between; font-size:11.8px; margin-bottom:5px;}
.compliance-head b{color:var(--text-bright); font-weight:700;}
.compliance-head span.pct{color:var(--text-dim); font-weight:700;}
.bar-track{height:6px; background:var(--bg-raised); border-radius:4px; overflow:hidden;}
.bar-fill{height:100%; border-radius:4px;}

/* ===== IAM FLOW DIAGRAM ===== */
.iam-flow{display:flex; align-items:center; gap:6px; overflow-x:auto; padding:6px 0 14px;}
.flow-node{
  border:1.5px solid; border-radius:10px; padding:10px 14px; min-width:140px; flex-shrink:0;
  background:var(--bg-raised);
}
.flow-node .fn-icon{width:26px; height:26px; border-radius:7px; display:flex; align-items:center; justify-content:center; margin-bottom:6px;}
.flow-node .fn-label{font-size:10px; color:var(--text-dim); font-weight:600;}
.flow-node .fn-val{font-size:12px; font-weight:700; color:var(--text-bright); margin-top:1px;}
.flow-arrow{color:var(--text-dim); flex-shrink:0;}
.risk-factor-row{display:grid; grid-template-columns:repeat(4,1fr); gap:10px;}
.risk-factor{
  border:1px solid var(--border); border-radius:10px; padding:10px 12px; display:flex; gap:9px; align-items:center;
  background:var(--bg-panel-alt);
}
.risk-factor .rf-icon{width:26px; height:26px; border-radius:7px; display:flex; align-items:center; justify-content:center; flex-shrink:0;}
.risk-factor .rf-label{font-size:11px; color:var(--text);}
.risk-factor .rf-level{font-size:10.5px; font-weight:700; margin-top:1px;}

/* ===== TABLES ===== */
table{width:100%; border-collapse:collapse; font-size:12px;}
th{
  text-align:left; padding:9px 10px; color:var(--text-dim); font-weight:700;
  border-bottom:1px solid var(--border); text-transform:uppercase; font-size:10px; letter-spacing:0.5px;
  position:sticky; top:0; background:var(--bg-panel);
}
td{padding:10px 10px; border-bottom:1px solid var(--border); vertical-align:middle;}
tr:hover td{background:rgba(255,255,255,0.02);}
.table-wrap{max-height:560px; overflow:auto; border:1px solid var(--border); border-radius:12px;}
.table-wrap table{border:none;}

.badge{display:inline-block; padding:2px 9px; border-radius:20px; font-size:10.5px; font-weight:700; letter-spacing:0.2px;}
.badge.critical{background:var(--red-dim); color:var(--red);}
.badge.high{background:var(--amber-dim); color:var(--amber);}
.badge.medium{background:rgba(155,110,243,0.14); color:var(--purple);}
.badge.low{background:rgba(56,189,248,0.14); color:var(--cyan);}
.badge.pass{background:var(--green-dim); color:var(--green);}
.badge.fail{background:var(--red-dim); color:var(--red);}
.pill{display:inline-block; padding:2px 8px; border-radius:6px; background:var(--bg-raised); color:var(--text-dim); font-size:10.5px; border:1px solid var(--border);}
.mono-sm{font-family:var(--mono); font-size:11.3px; color:var(--text-dim);}
.link-btn{color:var(--blue); cursor:pointer; font-weight:600; text-decoration:none;}
.link-btn:hover{color:var(--text-bright);}

.btn{
  background:var(--blue); border:none; color:#fff; padding:9px 16px; border-radius:8px; font-family:var(--sans);
  font-size:12.5px; font-weight:700; cursor:pointer;
}
.btn:hover{background:#3d68e8;}
.btn.ghost{background:transparent; border:1px solid var(--border); color:var(--text-dim);}
.btn.ghost:hover{border-color:var(--border-bright); color:var(--text);}
.btn:disabled{opacity:0.4; cursor:not-allowed;}

textarea, input, select{
  background:var(--bg-raised); border:1px solid var(--border); color:var(--text);
  font-family:var(--mono); font-size:12px; padding:10px 12px; border-radius:8px; width:100%;
}
textarea:focus, input:focus, select:focus{outline:none; border-color:var(--blue-dim);}

.detail-panel{border:1px solid var(--border); border-radius:12px; background:var(--bg-panel-alt); padding:18px; margin-top:14px; display:none;}
.detail-panel.show{display:block;}
.detail-grid{display:grid; grid-template-columns:1.3fr 1fr; gap:20px;}
.kv{display:flex; justify-content:space-between; padding:6px 0; border-bottom:1px solid var(--border); font-size:12px;}
.kv span:first-child{color:var(--text-dim);}
.code-block{background:#060a14; border:1px solid var(--border); border-radius:8px; padding:12px 14px; font-family:var(--mono); font-size:11.3px; color:var(--green); overflow-x:auto; white-space:pre; margin-top:8px;}
.code-tabs{display:flex; gap:4px; margin-top:12px;}
.code-tab{padding:5px 12px; font-size:11px; border-radius:6px 6px 0 0; background:var(--bg-raised); color:var(--text-dim); cursor:pointer; border:1px solid var(--border); border-bottom:none;}
.code-tab.active{background:#060a14; color:var(--blue);}

.copilot-shell{display:flex; flex-direction:column; height:560px; border:1px solid var(--border); border-radius:14px; background:var(--bg-panel);}
.copilot-msgs{flex:1; overflow-y:auto; padding:18px; display:flex; flex-direction:column; gap:14px;}
.msg{max-width:78%; padding:10px 14px; border-radius:12px; font-size:12.5px; line-height:1.55; white-space:pre-wrap;}
.msg.user{align-self:flex-end; background:var(--blue); color:#fff;}
.msg.ai{align-self:flex-start; background:var(--bg-raised); border:1px solid var(--border); color:var(--text);}
.msg.sys{align-self:center; color:var(--text-dim); font-size:11px; font-style:italic;}
.copilot-input{display:flex; gap:8px; padding:14px; border-top:1px solid var(--border);}
.suggestion-chip{padding:5px 11px; border:1px solid var(--border); border-radius:20px; font-size:11px; color:var(--text-dim); cursor:pointer; white-space:nowrap;}
.suggestion-chip:hover{border-color:var(--blue-dim); color:var(--blue);}
.typing{display:inline-flex; gap:3px;}
.typing span{width:5px; height:5px; background:#fff; border-radius:50%; animation:tb 1.1s infinite;}
.typing span:nth-child(2){animation-delay:.15s;} .typing span:nth-child(3){animation-delay:.3s;}
@keyframes tb{0%,60%,100%{opacity:.25; transform:translateY(0);} 30%{opacity:1; transform:translateY(-3px);}}

.chart-box{position:relative; height:190px;}
.footnote{font-size:10.5px; color:var(--text-dim); margin-top:12px; border-top:1px dashed var(--border); padding-top:10px;}
.placeholder-card{border:1px dashed var(--border-bright); border-radius:12px; padding:24px; text-align:center; color:var(--text-dim); font-size:12px;}

@media (max-width:1200px){
  .dash-grid{grid-template-columns:1fr;}
  .row3{grid-template-columns:1fr 1fr;}
}
@media (max-width:900px){
  .metrics-row{grid-template-columns:repeat(2,1fr);}
  .row3, .row-resources{grid-template-columns:1fr;}
  .sidebar{display:none;}
}
</style>
</head>
<body>

<div class="shell">
  <div class="sidebar" id="sidebar"></div>
  <div class="content">
    <div class="topbar" id="topbar"></div>
    <div class="main" id="mainArea"></div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>

/* ---- run the scanner: real evaluation of RULES against INVENTORY ---- */
function runScan(inventory, rules){
  const findings = [];
  inventory.forEach(resource=>{
    rules.forEach(rule=>{
      if(rule.check(resource)){
        findings.push(buildFinding(resource, rule));
      }
    });
  });
  return findings.sort((a,b)=>b.riskScore-a.riskScore);
}

/* ---- Module 3: AI risk engine — deterministic weighted-blast-radius scoring ----
   score blends: rule severity base, exposure (internet reachability),
   privilege (IAM impact), sensitivity (data classification), and
   criticality of the resource + a blast-radius estimate from co-located
   resources sharing tags/region/type-adjacency. This mirrors what a real
   "AI risk engine" module would compute — the AI framing in the spec is a
   scoring/explanation layer over structured signals like these. */
const SEVERITY_BASE = { critical:78, high:58, medium:38, low:20 };
const CRIT_MULT = { critical:1.25, high:1.1, medium:1.0, low:0.85 };

function estimateBlastRadius(resource, inventory){
  return inventory.filter(r=>
    r.id!==resource.id && (r.region===resource.region || r.provider===resource.provider)
  ).length + 1;
}

function buildFinding(resource, rule){
  const base = SEVERITY_BASE[rule.severity];
  const critMult = CRIT_MULT[resource.criticality || "medium"];
  const signalScore = (rule.exposure*22) + (rule.privilege*14) + (rule.sensitivity*14);
  let riskScore = Math.round((base + signalScore) * critMult);
  riskScore = Math.max(1, Math.min(100, riskScore));

  const attackProbability = Math.min(97, Math.round(35 + rule.exposure*45 + rule.privilege*15));
  const blastRadius = estimateBlastRadius(resource, INVENTORY);
  const businessImpact = riskScore>=85 ? "Critical" : riskScore>=65 ? "High" : riskScore>=40 ? "Moderate" : "Low";
  const breachLikelihood = attackProbability>=75 ? "High" : attackProbability>=50 ? "Medium" : "Low";

  return {
    findingId: `${rule.id}::${resource.id}`,
    ruleId: rule.id,
    resource, rule,
    title: rule.name,
    message: rule.message,
    severity: rule.severity,
    provider: resource.provider,
    riskScore, attackProbability, blastRadius, businessImpact, breachLikelihood,
  };
}

/* ---- Module 4: IAM attack path analyzer — real BFS over the IAM graph
   looking for any path from a user/role node to an admin-tier policy ---- */
function findEscalationPaths(graph){
  const adj = {};
  graph.edges.forEach(e=>{
    if(!adj[e.from]) adj[e.from]=[];
    adj[e.from].push(e);
  });
  const adminNodes = graph.nodes.filter(n=>n.kind==="policy_admin").map(n=>n.id);
  const userRoleNodes = graph.nodes.filter(n=>n.kind==="user"||n.kind==="role");
  const paths = [];

  userRoleNodes.forEach(start=>{
    const queue = [[start.id]];
    const seen = new Set([start.id]);
    while(queue.length){
      const path = queue.shift();
      const current = path[path.length-1];
      if(adminNodes.includes(current) && path.length>1){
        paths.push(path);
        continue;
      }
      (adj[current]||[]).forEach(edge=>{
        if(!seen.has(edge.to) || adminNodes.includes(edge.to)){
          seen.add(edge.to);
          queue.push([...path, edge.to]);
        }
      });
    }
  });
  // de-dupe identical paths
  const uniq = [];
  const keys = new Set();
  paths.forEach(p=>{
    const k = p.join(">");
    if(!keys.has(k)){ keys.add(k); uniq.push(p); }
  });
  return uniq;
}

/* ---- Module 5: Terraform static scanner — real regex-based IaC checks ---- */
const TF_RULES = [
  { id:"tf-hardcoded-secret", severity:"critical",
    pattern:/(access_key|secret_key)\s*=\s*"[A-Za-z0-9\/+=]{16,}"/g,
    message:"Hardcoded AWS credential literal in provider/resource block.",
    fix:(line)=>line.replace(/"[A-Za-z0-9\/+=]{16,}"/, "null  # inject via TF_VAR_ or a secrets backend, never hardcode") },
  { id:"tf-s3-public-acl", severity:"critical",
    pattern:/acl\s*=\s*"public-read(-write)?"/g,
    message:"S3 bucket ACL is set to a public value.",
    fix:(line)=>line.replace(/"public-read(-write)?"/, '"private"') },
  { id:"tf-open-ingress", severity:"critical",
    pattern:/cidr_blocks\s*=\s*\["0\.0\.0\.0\/0"\]/g,
    message:"Security group ingress rule is open to the entire internet.",
    fix:(line)=>line.replace(/\["0\.0\.0\.0\/0"\]/, '["10.0.0.0/16"]  # scope to a real CIDR') },
  { id:"tf-rds-public", severity:"critical",
    pattern:/publicly_accessible\s*=\s*true/g,
    message:"RDS instance is configured as publicly accessible.",
    fix:(line)=>line.replace(/true/, "false") },
  { id:"tf-wildcard-iam", severity:"high",
    pattern:/Action\s*=\s*"\*"/g,
    message:"IAM policy statement grants wildcard action permissions.",
    fix:(line)=>line.replace(/"\*"/, '"s3:GetObject"  # scope to the specific actions actually required') },
  { id:"tf-wildcard-resource", severity:"high",
    pattern:/Resource\s*=\s*"\*"/g,
    message:"IAM policy statement grants access to all resources.",
    fix:(line)=>line.replace(/"\*"/, '"arn:aws:s3:::specific-bucket/*"') },
  { id:"tf-skip-snapshot", severity:"medium",
    pattern:/skip_final_snapshot\s*=\s*true/g,
    message:"Database will be destroyed with no final snapshot on teardown.",
    fix:(line)=>line.replace(/true/, "false") },
];

function scanTerraform(source){
  const lines = source.split("\n");
  const findings = [];
  lines.forEach((line, idx)=>{
    TF_RULES.forEach(rule=>{
      rule.pattern.lastIndex = 0;
      if(rule.pattern.test(line)){
        findings.push({ ...rule, lineNo: idx+1, lineText: line.trim() });
      }
    });
  });
  return findings;
}

function generateSecureTerraform(source, findings){
  const lines = source.split("\n");
  findings.forEach(f=>{
    const idx = f.lineNo - 1;
    lines[idx] = lines[idx].replace(f.lineText.trim(), f.fix(f.lineText).trim());
  });
  return lines.join("\n");
}

  const arr=[]; let v=base*0.7;
  for(let i=0;i<len;i++){ v += (base-v)*0.22 + (Math.sin(i*1.3)*base*0.03); arr.push(Math.round(v)); }
  arr[arr.length-1]=base;
  return arr;
}

function renderMiniFlow(path){

  return `<div class="iam-flow">
    ${path.map((nodeId,i)=>{
      const node = IAM_GRAPH.nodes.find(n=>n.id===nodeId);
      const kind = kindOf(nodeId);
      const c = kindColor[kind];

      return `<div class="flow-node" style="border-color:${c}55;">

function computeFrameworkPct(controls){
  const total = controls.length;
  const failing = controls.filter(c=>c.ruleIds.some(rid=>FINDINGS.some(f=>f.ruleId===rid))).length;
  return Math.round(((total-failing)/total)*100);
}

    { label:"ISO 27001", controls:ISO_CONTROLS },
    { label:"CSA CCM", controls:CSA_CONTROLS },
  ];
  return frameworks.map(fw=>{
    const pct = computeFrameworkPct(fw.controls);
    const color = pct>=70?"var(--green)":pct>=50?"var(--amber)":"var(--red)";
    return `<div class="compliance-row">

}

function computeTopRiskCategory(){
  const categoryOf = (ruleId)=>{
    if(["open-ssh","default-sg-open","eks-public-endpoint","s3-public-read","rds-public","azure-public-blob","gcp-allusers-viewer"].includes(ruleId)) return "Network & Public Exposure";
    if(["direct-admin-policy","old-access-key","mfa-disabled"].includes(ruleId)) return "IAM Privilege Escalation";
    if(["s3-unencrypted","rds-unencrypted","ebs-unencrypted","kms-rotation-disabled","snapshot-public-unencrypted"].includes(ruleId)) return "Encryption Gaps";
    return "Logging & Monitoring Gaps";
  };
  const tally = {};
  FINDINGS.forEach(f=>{ const c=categoryOf(f.ruleId); tally[c]=(tally[c]||0)+f.riskScore; });
  return Object.entries(tally).sort((a,b)=>b[1]-a[1])[0][0];
}

function renderIamGraph(){
  const container = document.getElementById("iamGraphSvg");
  if(!container) return;
  const width = container.clientWidth || 480, height = 340;
  const tiers = { user:[], role:[], policy:[], policy_admin:[] };
  IAM_GRAPH.nodes.forEach(n=> tiers[n.kind].push(n));

  const colX = { user:70, role:width/2, policy:width-90, policy_admin:width-90 };
  const positions = {};
  ["user","role"].forEach(kind=>{
    tiers[kind].forEach((n,i)=>{
      positions[n.id] = { x: colX[kind], y: 40 + i*(height-80)/Math.max(1,tiers[kind].length-1||1) };
    });
  });
  const policyNodes = [...tiers.policy, ...tiers.policy_admin];
  policyNodes.forEach((n,i)=>{
    positions[n.id] = { x: colX.policy, y: 30 + i*(height-60)/Math.max(1,policyNodes.length-1) };
  });

  const escalationEdgeKeys = new Set();
  ESCALATION_PATHS.forEach(p=>{ for(let i=0;i<p.length-1;i++) escalationEdgeKeys.add(p[i]+">"+p[i+1]); });
  const kindColor = { user:"#38bdf8", role:"#9b6ef3", policy:"#6b7794", policy_admin:"#f0455c" };

  let svg = `<svg viewBox="0 0 ${width} ${height}" width="100%" height="${height}">`;
  IAM_GRAPH.edges.forEach(e=>{
    const a = positions[e.from], b = positions[e.to];
    if(!a||!b) return;
    const hot = escalationEdgeKeys.has(e.from+">"+e.to);
    svg += `<line x1="${a.x}" y1="${a.y}" x2="${b.x}" y2="${b.y}" stroke="${hot?'#f0455c':'#243252'}" stroke-width="${hot?2:1.2}" ${hot?'stroke-dasharray="5,3"':''} />`;
  });
  IAM_GRAPH.nodes.forEach(n=>{
    const p = positions[n.id]; if(!p) return;
    const r = n.kind==="policy_admin" ? 9 : 7;
    svg += `<circle cx="${p.x}" cy="${p.y}" r="${r}" fill="${kindColor[n.kind]}" stroke="#0a0f1d" stroke-width="2"/>`;
    const anchor = p.x > width-120 ? "end" : "start";
    const dx = p.x > width-120 ? -12 : 12;
    svg += `<text x="${p.x+dx}" y="${p.y+4}" font-size="10" font-family="JetBrains Mono" fill="#c3cbe0" text-anchor="${anchor}">${n.label}</text>`;
  });
  svg += `</svg>`;
  container.innerHTML = svg;
}

              <td><span class="badge ${r.status}">${r.status}</span></td>

      </table>
    </div>`;
  }).join("");
}

/* ================= TERRAFORM SCANNER ================= */
function viewTerraform(){
  return `
  <div class="row3" style="grid-template-columns:1fr 1fr;">
    <div class="card">
      <div class="card-title">Paste Terraform<span class="link-btn" id="loadSample">load sample vulnerable config</span></div>
      <textarea id="tfInput" rows="20" spellcheck="false">${SAMPLE_TF}</textarea>
      <div style="margin-top:10px;"><button class="btn" id="runTfScan">Run Scan</button></div>
    </div>
    <div class="card">
      <div class="card-title">Findings</div>
      <div id="tfFindings" style="font-size:12px; color:var(--text-dim);">Run a scan to see results.</div>
    </div>
  </div>
  <div class="card" style="margin-top:14px; display:none;" id="tfFixedCard">
    <div class="card-title">Auto-Generated Secure Version</div>
    <div class="code-block" id="tfFixed"></div>
  </div>
  `;
}
function wireTerraformView(){
  document.getElementById("loadSample").addEventListener("click", ()=>{
    document.getElementById("tfInput").value = SAMPLE_TF;
  });
  document.getElementById("runTfScan").addEventListener("click", ()=>{
    const src = document.getElementById("tfInput").value;
    const findings = scanTerraform(src);
    const box = document.getElementById("tfFindings");
    if(findings.length===0){
      box.innerHTML = `<span class="badge pass">No issues found</span>`;
      document.getElementById("tfFixedCard").style.display="none";
      return;
    }
    box.innerHTML = findings.map(f=>`
      <div style="padding:9px 0; border-bottom:1px solid var(--border);">
        <span class="badge ${f.severity}">${f.severity}</span>
        <span style="margin-left:8px; font-size:12px;">${f.message}</span>
        <div class="mono-sm" style="margin-top:4px;">line ${f.lineNo}: ${escapeHtml(f.lineText)}</div>
      </div>
    `).join("");
    const fixed = generateSecureTerraform(src, findings);
    document.getElementById("tfFixed").textContent = fixed;
    document.getElementById("tfFixedCard").style.display="block";
  });
}

/* ================= THREAT INTELLIGENCE ================= */
function viewThreatIntel(){
  const publicIps = INVENTORY.filter(r=>r.publicIp).map(r=>({resource:r.name, ip:r.publicIp}));
  const matches = [];
  publicIps.forEach(p=>{
    const hit = THREAT_INTEL_IOCS.find(ioc=>ioc.ip===p.ip);
    if(hit) matches.push({ ...p, ...hit });
  });
  return `
  <div class="card">
    <div class="card-title">Public IP Indicator Match</div>
    <p style="font-size:12px; color:var(--text-dim);">Checks every discovered public IP against a small sample indicator list (not a live threat feed) to demonstrate real match logic.</p>
    <div class="table-wrap" style="margin-top:12px;">
      <table>
        <thead><tr><th>Resource</th><th>Public IP</th><th>Match</th></tr></thead>
        <tbody>
          ${publicIps.map(p=>{
            const hit = THREAT_INTEL_IOCS.find(ioc=>ioc.ip===p.ip);
            return `<tr>
              <td class="mono-sm">${p.resource}</td>
              <td class="mono-sm">${p.ip}</td>
              <td>${hit?`<span class="badge fail">${hit.type} (${hit.confidence})</span>`:`<span class="badge pass">no match</span>`}</td>
            </tr>`;
          }).join("")}
        </tbody>
      </table>
    </div>
  </div>
  <div class="card" style="margin-top:14px;">
    <div class="card-title">Sample Indicator List</div>
    <table>
      <thead><tr><th>Indicator</th><th>Type</th><th>Confidence</th></tr></thead>
      <tbody>${THREAT_INTEL_IOCS.map(ioc=>`<tr><td class="mono-sm">${ioc.ip}</td><td>${ioc.type}</td><td>${ioc.confidence}</td></tr>`).join("")}</tbody>
    </table>
  </div>
  `;
}

/* ================= ATTACK SIMULATION (mapped, not live) ================= */
function viewAttackSim(){
  const scenarios = [
    { name:"S3 Data Theft", mapsTo:["s3-public-read","snapshot-public-unencrypted"] },
    { name:"Credential Theft", mapsTo:["lambda-hardcoded-secret","old-access-key"] },
    { name:"Privilege Escalation", mapsTo:["direct-admin-policy"] },
    { name:"Insider Attack", mapsTo:["mfa-disabled","direct-admin-policy"] },
    { name:"Crypto Mining via Compute", mapsTo:["open-ssh","eks-public-endpoint"] },
    { name:"Ransomware Blast Radius", mapsTo:["rds-unencrypted","ebs-unencrypted"] },
  ];
  return `
  <div class="footnote" style="margin-bottom:14px; border-top:none;">This view maps attack scenarios to findings your scan actually detected, rather than running a live penetration-test simulator.</div>
  <div class="row-resources" style="grid-template-columns:repeat(3,1fr);">
    ${scenarios.map(s=>{
      const linked = FINDINGS.filter(f=>s.mapsTo.includes(f.ruleId));
      return `<div class="card">
        <div class="card-title">${s.name}</div>
        ${linked.length ? linked.map(f=>`<div class="misconfig-row"><div class="misconfig-icon" style="background:${SEV_HEX[f.severity]}22;color:${SEV_HEX[f.severity]}">${icon("crosshair")}</div><div class="lbl">${f.resource.name}</div><span class="badge ${f.severity}">${f.severity}</span></div>`).join("")
          : `<p style="font-size:11.5px; color:var(--text-dim);">No matching findings currently open for this scenario.</p>`}
      </div>`;
    }).join("")}
  </div>
  `;
}

/* ================= REPORTS ================= */
function buildReportText(){
  const pct = computeFrameworkPct(CIS_CONTROLS);
  const lines = [];
  lines.push("CLOUDSENTINEL AI — EXECUTIVE SECURITY REPORT");
  lines.push("Generated: " + new Date().toString());
  lines.push("");
  lines.push(`Overall risk score: ${Math.round(FINDINGS.reduce((a,f)=>a+f.riskScore,0)/FINDINGS.length)}/100`);
  lines.push(`Total findings: ${FINDINGS.length} (Critical: ${critCount("critical")}, High: ${critCount("high")}, Medium: ${critCount("medium")}, Low: ${critCount("low")})`);
  lines.push(`CIS AWS compliance: ${pct}%`);
  lines.push(`IAM escalation paths detected: ${ESCALATION_PATHS.length}`);
  lines.push("");
  lines.push("TOP FINDINGS:");
  FINDINGS.slice(0,10).forEach(f=>{
    lines.push(`  [${f.severity.toUpperCase()}] ${f.title} — ${f.resource.name} — risk ${f.riskScore}/100`);
  });
  lines.push("");
  lines.push("IAM ESCALATION PATHS:");
  ESCALATION_PATHS.forEach(p=> lines.push("  " + p.join(" -> ")));
  return lines.join("\n");
}
function viewReports(){
  return `
  <div class="card">
    <div class="card-title">Executive Summary Report</div>
    <p style="font-size:12px; color:var(--text-dim);">Generates a plain-text report from the current live scan state — findings, risk scores, compliance percentage, and IAM escalation paths.</p>
    <div style="margin-top:12px;"><button class="btn" id="genReport">Generate & Download Report</button></div>
    <div class="code-block" id="reportPreview" style="margin-top:14px; max-height:300px; overflow:auto;"></div>
  </div>
  `;
}
function wireReportsView(){
  document.getElementById("genReport").addEventListener("click", ()=>{
    const text = buildReportText();
    document.getElementById("reportPreview").textContent = text;
    const blob = new Blob([text], {type:"text/plain"});
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = "cloudsentinel-executive-report.txt";
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(url);
  });
}

/* ================= AI COPILOT (live Claude API call) ================= */
function viewCopilot(){
  return `
  <div class="copilot-shell">
    <div class="copilot-msgs" id="copilotMsgs">
      <div class="msg sys">Copilot has context on ${FINDINGS.length} findings, ${ESCALATION_PATHS.length} IAM escalation paths, and compliance state across 5 frameworks.</div>
      <div class="msg ai">Hi — I'm the CloudSentinel copilot. Ask me things like "what's my riskiest finding" or "how do I fix the S3 bucket exposure", and I'll answer from the live scan data.</div>
    </div>
    <div style="padding:0 14px 10px; display:flex; gap:8px; flex-wrap:wrap;">
      <div class="suggestion-chip" data-q="What is my single riskiest finding right now and why?">riskiest finding?</div>
      <div class="suggestion-chip" data-q="Explain the IAM privilege escalation paths in plain English.">explain IAM paths</div>
      <div class="suggestion-chip" data-q="Which findings are blocking CIS compliance and how do I fix them fastest?">fix compliance fastest</div>
      <div class="suggestion-chip" data-q="Give me a prioritized remediation plan for this week.">prioritize remediation</div>
    </div>
    <div class="copilot-input">
      <input id="copilotInput" placeholder="Ask about findings, IAM paths, remediation, compliance...">
      <button class="btn" id="copilotSend">Send</button>
    </div>
  </div>
  <div class="footnote">This calls the live Anthropic API (Claude) with the current scan state as context. If it can't reach the API in your environment, it'll say so rather than fabricate an answer.</div>
  `;
}
function buildCopilotContext(){
  return JSON.stringify({
    total_findings: FINDINGS.length,
    findings_summary: FINDINGS.map(f=>({ title:f.title, resource:f.resource.name, severity:f.severity, riskScore:f.riskScore, attackProbability:f.attackProbability, businessImpact:f.businessImpact })),
    iam_escalation_paths: ESCALATION_PATHS,
    compliance_pct: computeFrameworkPct(CIS_CONTROLS),
  });
}
function addMsg(role, text){
  const box = document.getElementById("copilotMsgs");
  const div = document.createElement("div");
  div.className = `msg ${role}`;
  div.textContent = text;
  box.appendChild(div);
  box.scrollTop = box.scrollHeight;
  return div;
}
async function askCopilot(question){
  addMsg("user", question);
  const box = document.getElementById("copilotMsgs");
  const typingDiv = document.createElement("div");
  typingDiv.className = "msg ai";
  typingDiv.innerHTML = `<span class="typing"><span></span><span></span><span></span></span>`;
  box.appendChild(typingDiv);
  box.scrollTop = box.scrollHeight;
  const sendBtn = document.getElementById("copilotSend");
  if(sendBtn) sendBtn.disabled = true;
  try{
    const response = await fetch("https://api.anthropic.com/v1/messages", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        model: "claude-sonnet-4-6",
        max_tokens: 1000,
        system: "You are the CloudSentinel AI security copilot, embedded in a CSPM dashboard. Answer the analyst's question using ONLY the JSON scan context provided in the user message. Be specific: cite exact resource names, risk scores, and finding titles from the context. Keep answers tight — a short paragraph or a compact bulleted list, security-engineer tone, no fluff.",
        messages: [ { role: "user", content: `Scan context (JSON):\n${buildCopilotContext()}\n\nQuestion: ${question}` } ]
      })
    });
    const data = await response.json();
    const textBlocks = (data.content||[]).filter(b=>b.type==="text").map(b=>b.text).join("\n");
    typingDiv.remove();
    addMsg("ai", textBlocks || "The API returned no text content for this question.");
  } catch(err){
    typingDiv.remove();
    addMsg("ai", "I couldn't reach the Claude API from this environment (" + err.message + "). This copilot is wired for a live call — when the origin has network access to api.anthropic.com, it will answer directly from the scan context above instead of a canned response.");
  } finally {
    if(sendBtn) sendBtn.disabled = false;
  }
}
function wireCopilotView(){
  document.getElementById("copilotSend").addEventListener("click", ()=>{
    const input = document.getElementById("copilotInput");
    const q = input.value.trim();
    if(!q) return;
    input.value = "";
    askCopilot(q);
  });
  document.getElementById("copilotInput").addEventListener("keydown", (e)=>{ if(e.key==="Enter"){ document.getElementById("copilotSend").click(); } });
  document.querySelectorAll(".suggestion-chip").forEach(chip=>{ chip.addEventListener("click", ()=> askCopilot(chip.dataset.q)); });
}

const VIEW_BUILDERS = {
  overview: viewOverview, inventory: viewInventory, findings: viewFindings,
  iam: viewIAM, riskengine: viewRiskEngine, compliance: viewCompliance,
  terraform: viewTerraform, remediation: viewRemediation, threatintel: viewThreatIntel,
  attacksim: viewAttackSim, copilot: viewCopilot, reports: viewReports, settings: viewSettings,
};

function renderAll(){
  renderSidebar();
  renderTopbar();

  main.innerHTML = VIEW_BUILDERS[currentView]();

  if(currentView==="overview") mountOverviewCharts();
  if(currentView==="iam") renderIamGraph();
  if(currentView==="riskengine") mountRiskEngineCharts();
  if(currentView==="terraform") wireTerraformView();
  if(currentView==="reports") wireReportsView();
  if(currentView==="copilot") wireCopilotView();

    document.querySelectorAll(".finding-row").forEach(row=>{
      row.addEventListener("click", ()=> renderFindingDetail(row.dataset.fid));
    });

}

renderAll();
